# Shared slam_toolbox param template used by all 3 robots.
# Each robot gets its own async_slam_toolbox_node instance in its own namespace,
# producing <ns>/map, which map_merge then fuses into a single /map.

slam_toolbox:
  ros__parameters:
    odom_frame: odom
    map_frame: map
    base_frame: base_link       # becomes <ns>/base_link via frame_prefix/namespace
    scan_topic: lidar           # becomes <ns>/lidar via namespace

    mode: mapping
    use_sim_time: true

    resolution: 0.05
    max_laser_range: 12.0
    minimum_time_interval: 0.5
    transform_timeout: 0.3
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000

    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver_type: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner_type: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
